<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>影视</title>
  <script src="./tgdrive-sdk.js" defer></script>
  <script type="module" src="./main.ts"></script>
</head>
<body>
<div id="app" hidden>
  <!-- 宽屏侧栏：桌面与平板沿用；手机隐藏，改用底部标签栏和顶栏「更多」。 -->
  <aside class="sidebar">
    <a class="brand" href="#home" aria-label="影视首页"><span class="brand-mark" data-icon="play"></span><span>影视</span></a>
    <nav aria-label="影视导航">
      <button data-nav="home" class="active"><span data-icon="home"></span><span>首页</span></button>
      <button data-nav="library"><span data-icon="library"></span><span>媒体库</span></button>
      <button data-nav="favorites"><span data-icon="heart"></span><span>收藏</span></button>
      <button data-nav="history"><span data-icon="clock"></span><span>历史</span></button>
    </nav>
    <div class="sidebar-bottom"><button id="source" class="quiet"><span data-icon="plus"></span><span>新建媒体库</span></button><button id="settings" class="quiet"><span data-icon="settings"></span><span>媒体库设置</span></button><button id="exit" class="quiet"><span data-icon="exit"></span><span>返回网盘</span></button></div>
  </aside>
  <main id="main" tabindex="-1">
    <header class="topbar">
      <button id="mobile-exit" class="tg-icon-btn mobile-only" aria-label="返回网盘"><span data-icon="back"></span></button>
      <h1 id="page-title">影视</h1>
      <div class="top-actions">
        <button id="search-toggle" class="tg-icon-btn mobile-only" aria-label="搜索当前媒体库" aria-expanded="false" aria-controls="search-form" hidden><span data-icon="search"></span></button>
        <button id="mobile-source" class="tg-icon-btn mobile-only" aria-label="媒体库设置"><span data-icon="library"></span></button>
        <button id="refresh" class="tg-icon-btn desktop-only" aria-label="刷新媒体库"><span data-icon="refresh"></span></button>
        <button id="more-toggle" class="tg-icon-btn mobile-only" aria-label="更多操作" aria-haspopup="dialog" aria-controls="more-menu"><span data-icon="more"></span></button>
      </div>
    </header>
    <div class="content">
      <div id="library-navigation" class="library-navigation" hidden><button id="library-back" class="secondary"><span data-icon="back"></span><span>全部媒体库</span></button><button id="library-edit-current" class="secondary"><span data-icon="settings"></span><span>设置当前媒体库</span></button></div>
      <section id="hero" class="hero" hidden><div class="hero-art" aria-hidden="true"></div><img id="hero-image" alt="" hidden /><div class="hero-shade"></div><div class="hero-content"><h2 id="hero-title"></h2><p id="hero-meta"></p><div class="hero-actions"><button id="hero-play" class="primary"><span data-icon="play"></span><span>播放</span></button><button id="hero-detail" class="glass-button"><span data-icon="info"></span><span>详情</span></button></div></div></section>
      <section id="continue-section" hidden><div class="section-heading"><h2>继续观看</h2></div><div id="continue-items" class="continue-items"></div></section>
      <section class="library-section"><div class="section-heading"><h2 id="section-title">我的媒体库</h2><span id="source-label" class="muted"></span><button id="new-library" class="secondary"><span data-icon="plus"></span><span>新建媒体库</span></button></div>
        <form id="search-form" class="filters"><div class="search-box"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索片名" aria-label="搜索视频文件名" enterkeyhint="search" /><button id="search-submit" type="button">搜索</button></div><select id="format" aria-label="视频格式"><option value="">全部格式</option><option value="mp4">MP4</option><option value="mkv">MKV</option><option value="webm">WebM</option><option value="mov">MOV</option><option value="others">其他格式</option></select><button id="directory-mode" type="button" class="secondary"><span data-icon="folder"></span><span>目录浏览</span></button></form>
        <div id="breadcrumbs" class="breadcrumbs" hidden></div>
        <p id="list-status" role="status"></p><button id="list-retry" class="secondary" type="button" hidden>重试加载本页</button><div id="libraries" class="libraries-grid" hidden></div><div id="items" class="poster-grid"></div>
        <div id="empty" class="empty" hidden><span class="empty-symbol" data-icon="film"></span><h3 id="empty-title">尚未创建媒体库</h3><p id="empty-text">创建一个媒体库，命名并选择存有影视的文件夹。进入该库后才会加载视频。</p><button id="empty-source" class="primary">新建媒体库</button></div>
        <div class="pagination"><button id="previous-page" class="secondary" hidden>上一页</button><span id="page-label"></span><button id="next-page" class="secondary" hidden>下一页</button></div>
        <p class="library-footnote">仅播放网盘内容 · 格式兼容性取决于设备 · 不进行服务器转码</p>
      </section>
    </div>
  </main>
  <nav class="bottom-nav tg-tabbar" aria-label="移动影视导航"><button data-nav="home" class="tg-tab active"><span data-icon="home"></span><span>首页</span></button><button data-nav="library" class="tg-tab"><span data-icon="library"></span><span>媒体库</span></button><button data-nav="favorites" class="tg-tab"><span data-icon="heart"></span><span>收藏</span></button><button data-nav="history" class="tg-tab"><span data-icon="clock"></span><span>历史</span></button></nav>
  <dialog id="more-menu" class="more-sheet" aria-label="更多操作">
    <div class="more-group"><button id="more-refresh" type="button"><span data-icon="refresh"></span><span>刷新</span></button><button id="more-new" type="button"><span data-icon="plus"></span><span>新建媒体库</span></button><button id="more-settings" type="button"><span data-icon="settings"></span><span>媒体库设置</span></button><button id="more-exit" type="button"><span data-icon="exit"></span><span>返回网盘</span></button></div>
    <button id="more-cancel" class="more-cancel" type="button">取消</button>
  </dialog>
  <!-- 详情：手机全屏推入，顶部为海报模糊放大的背景；桌面为居中弹窗。 -->
  <dialog id="detail" aria-labelledby="detail-title"><div id="detail-backdrop" class="detail-backdrop" aria-hidden="true"></div><button id="detail-close" class="dialog-close" aria-label="关闭详情"><span class="icon-close" data-icon="close"></span><span class="icon-back" data-icon="back"></span></button><div class="detail-top"><div id="detail-poster" class="detail-poster"></div><div class="detail-copy"><h2 id="detail-title"></h2><p id="detail-meta" class="muted"></p><p id="detail-progress"></p></div></div><div class="detail-actions"><button id="detail-play" class="primary"><span data-icon="play"></span><span>播放</span></button></div><div class="detail-tools"><button id="detail-restart" class="detail-tool"><span data-icon="restart"></span><span>从头播放</span></button><button id="detail-favorite" class="detail-tool" aria-pressed="false"><span data-icon="heart"></span><span>收藏</span></button><button id="detail-download" class="detail-tool"><span data-icon="download"></span><span>下载</span></button><button id="detail-show-file" class="detail-tool"><span data-icon="folder"></span><span>在文件中显示</span></button><button id="detail-file-info" class="detail-tool"><span data-icon="info"></span><span>文件信息</span></button></div><p id="detail-path" class="file-path"></p><div class="episodes-heading"><h3>同目录合集</h3><span id="episode-count" class="muted"></span></div><p id="detail-status" role="status"></p><button id="detail-retry" class="secondary" type="button" hidden>重新加载详情</button><div id="episodes" class="episodes"></div><div class="pagination"><button id="episodes-prev" class="secondary" hidden>上一批选集</button><button id="episodes-next" class="secondary" hidden>下一批选集</button></div></dialog>
  <section id="player" class="player" role="dialog" aria-modal="true" aria-label="影视播放器" tabindex="-1" hidden>
    <header class="player-header"><button id="player-back" class="glass-button" aria-label="返回片库"><span data-icon="back"></span><span class="label">返回片库</span></button><div><h2 id="playing-title"></h2><span id="play-mode" class="muted"></span></div><button id="player-download" class="icon-button" aria-label="下载当前视频"><span data-icon="download"></span></button></header>
    <div id="stage" class="stage"><video id="video" preload="none" playsinline crossorigin="anonymous"></video><button id="big-play" class="big-play" aria-label="播放视频"><span data-icon="play"></span></button><div id="play-message" class="play-message" role="status" hidden></div></div>
    <div class="player-controls"><div class="timeline"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="播放进度" /><span id="duration">0:00</span></div><div class="control-row"><button id="toggle-play" class="icon-button" aria-label="播放或暂停"><span data-icon="play"></span></button><button id="rewind" class="icon-button" aria-label="快退十秒"><span data-icon="rewind"></span></button><button id="forward" class="icon-button" aria-label="快进十秒"><span data-icon="forward"></span></button><button id="previous-episode" class="icon-button" aria-label="上一集"><span data-icon="previous"></span></button><button id="next-episode" class="icon-button" aria-label="下一集"><span data-icon="next"></span></button><button id="mute" class="icon-button" aria-label="切换静音"><span data-icon="volume"></span></button><input id="volume" class="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量" /><span class="control-spacer"></span><select id="speed" aria-label="播放倍速"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="options-toggle" class="icon-button" aria-label="字幕与播放设置"><span data-icon="settings"></span></button><button id="pip" class="icon-button" aria-label="画中画" hidden><span data-icon="pip"></span></button><button id="fullscreen" class="icon-button" aria-label="全屏播放"><span data-icon="fullscreen"></span></button></div></div>
    <div id="play-options" class="play-options" hidden><div class="section-heading"><h3>播放设置</h3><button id="options-close" class="icon-button" aria-label="关闭播放设置"><span data-icon="close"></span></button></div><label>字幕<select id="subtitle"><option value="">关闭字幕</option></select></label><label>字幕编码<select id="encoding"><option value="utf-8">UTF-8</option><option value="gb18030">GB18030 / GBK</option></select></label><label>字幕大小<input id="subtitle-size" type="range" min="14" max="40" value="22" /></label><label>字幕偏移（秒）<input id="subtitle-offset" type="number" min="-10" max="10" step="0.5" value="0" /></label><label>音轨<select id="audio"><option value="">默认音轨</option></select></label><label>画面<select id="fit"><option value="contain">适应画面</option><option value="cover">填满画面</option></select></label><label class="check-label"><input id="autoplay" type="checkbox" checked />自动播放下一集</label><fieldset id="series-options" disabled><legend>本剧跳过设置（同文件夹）</legend><label>片头秒数<input id="skip-intro" type="number" min="0" max="600" step="1" value="0" /></label><label>片尾秒数<input id="skip-outro" type="number" min="0" max="600" step="1" value="0" /></label><button id="save-series" type="button">保存本剧设置</button><p id="series-status" role="status"></p></fieldset><label>定时停止<select id="sleep-timer"><option value="0">关闭</option><option value="-1">本集播完</option><option value="15">15 分钟</option><option value="30">30 分钟</option><option value="60">60 分钟</option><option value="120">120 分钟</option></select></label><p class="muted">ASS 仅显示文本，不还原特效；不支持图片字幕。</p></div>
    <div id="sync-bar" class="sync-bar"><span id="sync-status"></span><button id="sync-retry" hidden>重试保存</button><button id="sync-remote" hidden>采用云端</button><button id="sync-local" hidden>保留本次</button></div><div id="next-countdown" class="next-countdown" hidden><span id="countdown-text"></span><button id="cancel-next">取消连播</button></div>
  </section>
  <dialog id="library-edit-dialog" aria-labelledby="library-edit-title">
    <form id="library-form">
      <h2 id="library-edit-title">新建媒体库</h2>
      <p class="library-hint">一个媒体库对应一个文件夹，包含其子文件夹。保存配置不会扫描视频。</p>
      <fieldset id="library-fields">
        <label for="library-name">媒体库名称</label>
        <input id="library-name" type="text" placeholder="例如：电影、电视剧" maxlength="100" required autocomplete="off" />
        <label for="library-path">文件夹</label>
        <output id="library-path">尚未选择文件夹</output>
        <button id="library-pick" type="button" class="secondary"><span data-icon="folder"></span><span>选择文件夹</span></button>
      </fieldset>
      <p id="library-edit-status" role="status"></p>
      <div class="detail-actions"><button id="library-cancel" type="button" class="secondary">取消</button><button id="library-save" type="button" class="primary">保存媒体库</button></div>
    </form>
  </dialog>
  <dialog id="confirm-dialog"><h3 id="confirm-title"></h3><p id="confirm-text"></p><div class="detail-actions"><button id="confirm-cancel" class="secondary">取消</button><button id="confirm-ok" class="primary">确认</button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<div id="boot-status" class="boot-status"><div><p id="boot-message" role="status">正在加载影视…</p><button id="boot-retry" type="button" hidden>重新加载影院</button><button id="boot-exit" type="button">返回网盘</button></div></div>
</body>
</html>
