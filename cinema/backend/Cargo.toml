[package]
name = "tgdrive-cinema"
version = "1.0.6"
edition.workspace = true
license.workspace = true
rust-version = "1.89"
publish = false

[dependencies]
tgdrive-backend-sdk = { path = "../../backend-sdk", version = "=1.0.0" }
tgdrive-contract = { path = "../../contract", version = "=1.0.0" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"
argon2 = "0.5"
rand = "0.9"
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
bytes = "1.11"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
http-body-util = "0.1"
hyper = { version = "1.11", default-features = false, features = ["http1"] }
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tgdrive-test-host = { path = "../../testing/backend-host", version = "=1.0.0" }
tempfile = "3"
hyper-util = { version = "0.1", features = ["tokio"] }

[[bin]]
name = "cinema"
path = "src/main.rs"
