<!doctype html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>短视频</title>
  <!-- tg-base.css 由构建时从 ui/base.css 复制进包内，源码目录不保留副本。 -->
  <link rel="stylesheet" href="./tg-base.css" />
  <link rel="stylesheet" href="./style.css" />
  <script defer src="./tgdrive-sdk.js"></script>
  <script defer src="./app.js"></script>
</head>
<body tabindex="-1">
  <main class="shorts">
    <header class="shorts-top">
      <button id="exit" class="tg-icon-btn top-button" aria-label="退出短视频" title="返回网盘（Esc）"><svg class="tg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="source-label" class="source-label" aria-label="更换取材文件夹"><svg class="tg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 6.5a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/></svg><span class="source-text">正在读取取材目录</span></button>
    </header>
    <div id="player" class="player" hidden>
      <video id="video" playsinline loop muted preload="auto" crossorigin="anonymous" aria-label="当前视频"></video>
      <div id="buffering" class="buffering" role="status" hidden><span class="spinner"></span><span>正在加载视频</span></div>
      <button id="play-prompt" class="play-prompt" hidden><svg class="tg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg><span>轻触播放</span></button>
      <div id="play-error" class="play-error" hidden>
        <p id="play-error-message">这个视频暂时无法播放，可以重试或下载后查看。</p><div class="error-actions"><button id="retry-video">重新播放</button><button id="skip-error">看下一个</button></div>
      </div>
    </div>
    <div id="loading-list" class="empty-state" role="status"><span class="spinner"></span><p>正在读取视频列表…</p></div>
    <div id="empty" class="empty-state" hidden>
      <span class="empty-symbol" aria-hidden="true"><svg class="tg-icon" viewBox="0 0 24 24" focusable="false"><path d="M7 4.5v15l12-7.5z"/></svg></span><h1 id="empty-title">还没有可播放的视频</h1>
      <p id="empty-description"></p><button id="open-settings" class="tg-primary">选择取材文件夹</button>
    </div>
    <div id="list-error" class="empty-state" hidden><h1>视频列表读取失败</h1><p id="list-error-message"></p><button id="retry-list" class="tg-primary">重新加载</button></div>
    <!-- 右侧竖排操作：图标随 aria-pressed 由样式切换，文字标签同时作为无障碍名称。 -->
    <aside id="actions" class="actions" hidden>
      <button id="favorite" class="action tg-icon-btn" title="收藏"><span class="symbol" aria-hidden="true"><svg class="tg-icon icon-off" viewBox="0 0 24 24" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg><svg class="tg-icon icon-on" viewBox="0 0 24 24" focusable="false"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z" fill="currentColor"/></svg></span><span class="label">收藏</span></button>
      <button id="mute" class="action tg-icon-btn" title="切换声音（M）"><span class="symbol" aria-hidden="true"><svg class="tg-icon icon-off" viewBox="0 0 24 24" focusable="false"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg><svg class="tg-icon icon-on" viewBox="0 0 24 24" focusable="false"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></span><span class="label">静音中</span></button>
      <button id="download" class="action tg-icon-btn" title="下载视频"><span class="symbol" aria-hidden="true"><svg class="tg-icon" viewBox="0 0 24 24" focusable="false"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg></span><span class="label">下载</span></button>
      <button id="shuffle" class="action tg-icon-btn" title="重新洗牌"><span class="symbol" aria-hidden="true"><svg class="tg-icon" viewBox="0 0 24 24" focusable="false"><path d="M3 7h3.5c4.5 0 6.5 10 11 10H21M3 17h3.5c1.6 0 2.8-1.3 3.9-3M14 9c1-1.2 2.1-2 3.5-2H21M18.5 4.5L21 7l-2.5 2.5M18.5 14.5L21 17l-2.5 2.5"/></svg></span><span class="label">洗牌</span></button>
      <div class="switchers"><button id="previous" class="tg-icon-btn" aria-label="上一个视频" title="上一个（↑）"><svg class="tg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 15l6-6 6 6"/></svg></button><button id="next" class="tg-icon-btn" aria-label="下一个视频" title="下一个（↓）"><svg class="tg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></button></div>
    </aside>
    <footer id="video-info" class="video-info" hidden>
      <div class="video-caption"><strong id="video-name"></strong><p id="video-meta"></p><span class="keyboard-hint">↑↓ 切换 · 空格暂停 · ←→ 快进后退 · M 静音</span><span class="touch-hint">上下滑动切换 · 轻触画面暂停</span></div>
      <div class="playback-controls">
        <button id="play-toggle" class="tg-icon-btn" data-state="playing" aria-label="暂停视频" title="播放或暂停（空格）"><svg class="tg-icon icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg><svg class="tg-icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/></svg></button>
        <div class="timeline"><div class="timeline-track" aria-hidden="true"><span id="buffered-progress"></span><span id="played-progress"></span></div><input id="seek" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="播放进度" /></div>
        <output id="playback-time">0:00 / --:--</output>
      </div>
    </footer>
    <div id="message" class="message tg-toast" role="status" hidden></div>
  </main>
</body>
</html>
