name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: tgdrive-app-stable-release
  cancel-in-progress: false

jobs:
  release:
    name: 插件打包与可信发布
    if: github.event_name == 'push' && github.repository == 'lengyuesky/tgdrive-app' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: 'npm'

      - name: 验证稳定 tag 与 main 祖先后才执行依赖脚本
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          node ./release.mjs validate-tag "$GITHUB_REF_NAME"

      - name: 安装依赖
        run: npm ci

      - name: 运行独立检查与测试
        run: |
          npm run check
          npm test
          npm run catalog verify ./catalog/catalog.json
          (cd catalog && sha256sum -c SHA256SUMS)

      - name: 失败关闭的历史、单调版本与草稿资产门禁
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./release.mjs publish ./catalog --tag="$GITHUB_REF_NAME" --repo="$GITHUB_REPOSITORY"
