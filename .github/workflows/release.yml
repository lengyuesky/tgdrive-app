name: 手动发布应用

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgdrive-app-release
  cancel-in-progress: false

jobs:
  branch:
    name: 仅允许 main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 拒绝从其他分支发布
        run: |
          if test "$GITHUB_REF" != refs/heads/main; then
            printf '发布只允许选择 main 分支\n' >&2
            exit 1
          fi

  checks-and-build:
    name: 全量门禁与双架构构建
    needs: branch
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: 不可变 Release 与目录快进提交
    needs: checks-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - name: 安装固定 Rust 工具链
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-app-packages
          path: ${{ runner.temp }}/verified-packages
          digest-mismatch: error
      - name: 重验、上传、公开下载核验并更新目录与历史
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node tools-v1/release.mjs --publish \
            --packages "$RUNNER_TEMP/verified-packages" \
            --output "$RUNNER_TEMP/release" \
            --catalog-state "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --source "$SOURCE_SHA"
