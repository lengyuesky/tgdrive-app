name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: 独立检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与插件构建
        run: npm run check

      - name: 运行独立单测与目录工具测试
        run: npm test

      - name: 校验生成目录
        run: npm run catalog verify ./catalog/catalog.json
