name: 全量检查与应用构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  checks:
    name: 契约、类型与全量测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm
      - name: 安装固定 Rust 工具链
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --no-self-update
      - name: 安装并验证真实媒体测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: 执行仓库内的统一门禁
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: node tools-v1/check-all.mjs --output "$RUNNER_TEMP/checks"

  build:
    name: 构建 ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            runner: ubuntu-24.04
            architecture: x86_64
          - target: linux-amd64
            runner: ubuntu-24.04
            architecture: x86_64
          # 公开仓库的官方 arm64 托管 runner；禁止用 QEMU 代替原生构建。
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm
      - name: 安装固定 Rust 工具链
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: 安装锁定页面依赖
        run: npm ci >"$RUNNER_TEMP/npm-ci.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/npm-ci.log"; exit 1; }
      - name: 原生构建、包核验与隔离启动探测
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          node tools-v1/build-all.mjs --target "$TARGET" --output "$RUNNER_TEMP/app-build" --probe
      - name: 保存本目标的已核验包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-packages-${{ matrix.target }}
          path: ${{ runner.temp }}/app-build/packages/*.tgapp
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  catalog:
    name: 双架构汇总与历史门禁
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - name: 安装固定 Rust 工具链
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-packages-*
          path: ${{ runner.temp }}/app-packages
          merge-multiple: true
          digest-mismatch: error
      - name: 重验全部包并以 main 的持久历史生成目录
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: node tools-v1/catalog-packages.mjs --packages "$RUNNER_TEMP/app-packages" --output "$RUNNER_TEMP/catalog-check" --catalog-state "$GITHUB_WORKSPACE"
      - name: 保存发布任务可重验的完整包集
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-app-packages
          path: ${{ runner.temp }}/app-packages/*.tgapp
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
